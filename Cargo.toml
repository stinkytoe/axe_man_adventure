[package]
name = "axe_man_adventure"
authors = ["stinkytoe <stinkytoe42@yahoo.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.29"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
shieldtank = { git = "https://github.com/stinkytoe/shieldtank.git" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
